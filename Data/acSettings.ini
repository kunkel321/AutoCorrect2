; ============================================================
; AutoCorrect2 Suite 'asSettings.ini' File
; ini File template version date:  8-8-2026 
; ============================================================
; Edit the values below to customize behavior and appearance of
; AutoCorrect2.ahk and related tools.  Keys can be edited directory,
; or by using the SettingsManager tool.  After editing, reload/restart
; the affected script for changes to take effect.
; ============================================================

[Files]
; File names only.  Relative paths are in the code of the various scripts.
; Many of these are accessed by multiple tools.
; HotstringLibrary is your personal library.
HotstringLibrary=AutoCorrectHotstrings.ahk
; NewTemporaryHotStrLib is the new version from GitHub. Rename to fit your workflow.
NewTemporaryHotstrLib=AutoCorrectHotstrings (1).ahk
BoilerplateHotstringLibrary=PersonalHotstrings.ahk
RemovedHsFile=RemovedHotstrings.txt
AutoCorrectsLogFile=AutoCorrectsLog.txt
ACLogContinuousFile=ACLogContinuous.txt
ErrContextLog=ErrContextLog.txt
ACLogAnalyzer=ACLogAnalyzer.exe
WordListFile=GitHubComboList249k.txt
FrequencyListFile=unigram_freq_list_filtered_89k.csv
MCLoggerPath=MCLogger.exe
MCLogFile=ManualCorrectionsLog.txt
MCLogContinuous=MCLogContinuous.txt
AutoCorrect2Script=AutoCorrect2.ahk
SettingsManager=SettingsManager.exe
; FileManagerPath= can be blank for Win Explorer.
FileManagerPath=C:\Program Files\XYplorer\XYplorer.exe

[Hotkeys]
HotstringHelperActivationHotkey=#h
AutoCorrect2EditThisScriptHk=+^e
LastTriggerHk=!F3
StringReportHk=^F3
SystemUpTimeHk=!+u
MCLoggerRunAnalysisHotkey=#^+q
MCLoggerSneakPeekHotkey=#+q
ACLogAnalyzerHk=!^+q
HotkeyHubHotkey=+!q

[Shared]
; Default editor for opening scripts (usually VSCode or Notepad).
DefaultEditor=Notepad.exe
EditorCmd=""C:\Users\steve\AppData\Local\Programs\Microsoft VS Code\Code.exe" -r -g "{file}:{line}""
; Define light/dark red/green.  (no 'c') 
LightGreen=b8f3ab
DarkGreen=0d3803
LightRed=fd7c73
DarkRed=B90012

[HotstringHelper]
; Enable/disable debug (very verbose) and error logging (1=yes, 0=no).
CODE_DEBUG_LOG=0
CODE_ERROR_LOG=0
; Optional Include
EnableHotStrQuickLookup=1
EnableDragTools=1
EnableMoveResizeTools=1
; Large font size for emphasis of trigger and replacement boxes (no 's').
DefaultFontSize=11
LargeFontSize=15
; Default width of main window (recommend: 366).
DefaultWidth=366
; Height/Width increase for larger boilerplate texts when 'Make Bigger' button is pressed.
WidthSizeIncrease=500
HeightSizeIncrease=400
ExamPaneListHeight=350
; Default focus to options|trigger|replacement|comment|auto 
InitialFocusTarget=auto
; Default hotstring options for boilerplate/template triggers.
; Prefix/Suffix for boilerplate triggers (leave blank for none)
; When creating an anagram for the boilerplate text...
DefaultBoilerPlateOpts=B0X
BoilerplatePrefix=;
BoilerplateSuffix=
FirstLettersToInclude=5
MinWordLength=2
; Ignore clipboard text longer than this when opening HotstringHelper (0 = no limit).
MaxClipLength=30
; Reopen HotstringHelper where you last dragged it (1) or centered every time (0).
RememberWindowPosition=1
SeparateLibForBoilerplates=1
BeepOnStartup=1
; Beep when a newly added rule is ready to use (1=yes, 0=no).  Multi-line rules still reload, and beep via BeepOnStartup.
BeepOnAppend=1
; Windows spell check in the Replacement box: misspelled text turns red; right-click a misspelled word for suggestions (1=yes, 0=no).
SpellCheckReplacement=1
; Opening HotstringHelper with nothing usable on the clipboard: start with the AutoCorrect defaults -- DefaultAutoCorrectOpts, Function and Log per MakeAcFuncByDefault, AC library (1) -- or a bare form (0).
EmptyFormDefaults=1
; Do you use the f(), or prefer vanilla ahk hotstrings? Check 'Make Function' box by default? (1=yes, 0=no)
; Default options for autocorrect entries -- B0X for f() use.  That's B zero X.  Don't use if MakeFuncByDefault=0
MakeAcFuncByDefault=1
MakeBpFuncByDefault=1
BeepOnFunctionCheck=1
DefaultAutoCorrectOpts=B0X*
; Add frequency/stats comments to new entries? This is used by the Ctrl-F3 Stats dialog. (1=yes, 0=no)
AutoCommentWithFreqAndStats=1
; Try to auto-type replacement for new AutoCorrect item, into active field. (1=yes, 0=no)
AutoEnterNewEntry=1
; Auto-open the Exam Pane when an existing AutoCorrect hotstring is captured. (1=yes, 0=no)
AutoOpenExamPane=1
; Auto-resize the replacement box to big-mode when BP text is large enough to need it. (1=yes, 0=no)
AutoBigReplBox=1
; Number of lines in replacement text that triggers big-mode (if AutoBigReplBox=1).
AutoBigLineLimit=5
; Number of characters in the longest line that triggers big-mode (if AutoBigReplBox=1).
AutoBigCharLimit=40

[ACSystem]
; Master switch to enable/disable all logging (1=yes, 0=no).
EnableLogging=1
; Beep when an autocorrection is made (1=yes, 0=no).
BeepOnCorrection=1
BackspaceWindow=3000
; Beep when a backspaced autocorrection's context is logged (1=yes, 0=no).
BeepOnContextLog=0
; Number of words to cache before, and additional words to wait for, after an autocorrection (for context logging).
; Also amount of time to wait for those following words.
PrecedingWordCount=8
FollowingWordCount=6
FollowingWordTimeout=12
; "SkipList" Apps where AutoCorrect should NOT trigger. Separate multiple apps with commas (no spaces).
AppSkiplist=RetroRewind.exe,RetroRewind-Win64-Shipping.exe,DDSurvivors-Win64-Shipping.exe,MineMogul.exe,VeinDemo-Win64-Test.exe,RimWorldWin64.exe,Sandustry.exe,Vein-Win64-Test.exe,Apocalypter.exe,QZSim-Win64-Shipping.exe
WinSkiplist=Hotstring Quick Lookup,Hotstring Helper
; Items for the AUto-COrrect TWo COnsecutive CApitals code
BeepOnCapFix=1
CapFixTwoLetterWords=1
; The two-letter words CapFixTwoLetterWords fixes when followed by a space (MY -> My), comma-separated.  Upstream's list lacks MY.
CapFixTwoLetterList=OF,TO,IN,IT,IS,AS,AT,WE,HE,BY,ON,BE,NO,MY,DO,GO,UP,IF,AN
; How long (ms) the double-capital fix waits for the third letter after the second capital.  Upstream is 300.
CapFixTimeoutMs=1000
; Append the focused program's .exe name to each AutoCorrect log line (1=yes, 0=no).
LogActiveExe=1
; Add the time and the whole word that changed (typed -> result) after each log line, tab-separated (1=yes, 0=classic line).
LogExtendedDetail=1
; Also log the double-capital fixes (THe -> The) as :*?C:TH::Th lines (1=yes, 0=no).
LogCapFixes=0
; Add where the rule lives -- BP:311 (PersonalHotstrings.ahk line 311) or AC:4146 (AutoCorrectHotstrings.ahk) -- after each log line's hotstring (1=yes, 0=no).
LogRuleLocation=1
; Backspacing a correction mutes that rule for SuppressSeconds so you can retype the word as intended (1=yes, 0=no).
SuppressAfterBackspace=1
SuppressSeconds=8
ShowTrayExtras=1

[MCLogger]
; Show tooltip/Beep every time a hotstring pattern is captured (1=yes, 0=no).
ShowEachHotString=1
BeepEachHotString=1
; Collect log items in RAM, then save to disk this often (in minutes).
; Stop collecting if no new pattern matches for this many intervals (intervals will auto-restart on next manual correction).
SaveIntervalMinutes=10
IntervalsBeforeStopping=2
; Export directly to HotString Helper2 GUI (1=yes, 0=append to AutoCorrect script)
SendToHH=1
; Also save full report to Windows Clipboard (1=yes, 0=no). Warning: does not restore previous clipboard contents.
SaveFullToClipboard=1
; When removing old single-occurrence items, only remove strings older than this many days.
AgeOfOldSingles=90
; When clicking 'Cull and Append', close the list each time (0) or keep it open (1).
KeepReportOpen=1
LetterOverlapMin=40
AdjacentKeyMin=60
HighlightCulled=1
DebugFilterLog=1

[ACLogAnalyzer]
; Importance weight for high-frequency items in weight calculation (0-50, 0=not important).
FreqImportance=10
; Minimum threshold for consideration when weighing items. Zero means consider them all.
IgnoreFewerThan=0
; Copy hotstring to clipboard when item is selected--Facilitates sending to HH (1=yes, 0=no).
CopyHotstringOnSelect=1
; Keep window pinned to top by default (1=yes, 0=no).
PinToTop=1
; Enable error logging to file.  Not AutoCorrection errors, but ACLogAnalyzer app runtime errors (1=yes, 0=no).
EnableErrorLogging=1
; Skip lines before this line number when reading log file.
StartLine=7
; Date format for culled items (MM-dd-yyyy, etc.).
CullDateFormat=MM-dd-yyyy

[Defunctionizer]
; if you purge the comments, then AutoCorrect2's ; Ctrl+F3 "Potential Fixes Report" will stop working correctly.
keepComments=0

[ControlButtons]
; Show (1) or hide (0) each Control Panel button, and whether clicking it closes HH (close) or keeps it open (stay).
; Format: ButtonName=1,stay  or  ButtonName=0,close  (second token optional, defaults to stay).
OpenLibrary=1,stay
PersonalHotstrings=1,stay
ACLog=1,close
ACLogContinuous=0,stay
ACAnalyze=1,close
BSLog=1,stay
RemovedHS=1,stay
MCLog=1,stay
MCLogContinuous=0,stay
MCAnalyze=1,close
Report=1,stay
SettingsMan=1,close
HotkeyRef=1,close
Suggester=0,stay
HsAnalyzer=1,close
HsAuditor=1,close
ExtractMisspellings=1,close
TypoInvaders=0,close
ConflictLocator=0,close
Updater=0,close
UniqueStringExtractor=0,close
Defunctionizer=0,close
OpenFolder=1,stay
GitHub=1,stay
Theme=1,close

[HotkeyHub]
ShowHidden=1
ShowApps=1
ScanAll=1
FriendlyNames=1
SortCol=1
SortDesc=0
WinX=196
WinY=46
WinW=728
WinH=722
